[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "semyzbay-backend"
version = "0.1.0"
description = "Safety and occupational health assistant backend"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "asyncpg==0.32.0",
  "celery==5.6.3",
  "email-validator==2.3.0",
  "fastapi==0.162.0",
  "fastembed==0.9.1",
  "greenlet==3.5.6",
  "httpx==0.28.1",
  "minio==7.2.20",
  "langchain-text-splitters==1.1.3",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.2",
  "python-multipart==0.0.32",
  "python-docx==1.2.0",
  "pypdf==6.21.4",
  "PyJWT==2.15.1",
  "qdrant-client==1.20.0",
  "redis==8.1.0",
  "SQLAlchemy==2.1.6",
  "structlog==26.1.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"app/core/security.py" = ["S105", "S106"]
"app/modules/auth/*.py" = ["S105", "S106"]
"tests/**/*.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
