name: semyzbay

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-semyzbay}:${POSTGRES_PASSWORD:-change_me}@semyzbay-postgres:5432/${POSTGRES_DB:-semyzbay_db}
  REDIS_URL: redis://semyzbay-redis:6379/0
  QDRANT_URL: http://semyzbay-qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-semyzbay_documents_v2}
  MINIO_ENDPOINT: semyzbay-minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-change_me}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me}
  MINIO_SECURE: "false"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace_with_at_least_32_random_characters}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_MODEL: ${LLM_MODEL:-gpt-6-luna}
  LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-6.1-sol}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
  OPENAI_STORE_RESPONSES: ${OPENAI_STORE_RESPONSES:-false}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
  SPARSE_EMBEDDING_MODEL: ${SPARSE_EMBEDDING_MODEL:-Qdrant/bm25}
  FASTEMBED_CACHE_PATH: /app/.cache/fastembed
  RAG_RETRIEVAL_LIMIT: ${RAG_RETRIEVAL_LIMIT:-30}
  RAG_RERANK_LIMIT: ${RAG_RERANK_LIMIT:-8}
  RAG_MIN_RELEVANCE_SCORE: ${RAG_MIN_RELEVANCE_SCORE:-0.05}
  RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-8000}
  RAG_MAX_CONTEXT_CHUNKS: ${RAG_MAX_CONTEXT_CHUNKS:-8}
  RAG_SEED_LIMIT: ${RAG_SEED_LIMIT:-4}
  RAG_NEIGHBOR_WINDOW: ${RAG_NEIGHBOR_WINDOW:-1}
  RAG_ALLOW_SUSPICIOUS_CONTEXT: ${RAG_ALLOW_SUSPICIOUS_CONTEXT:-false}
  RAG_TRANSLATE_KAZAKH_QUERIES: ${RAG_TRANSLATE_KAZAKH_QUERIES:-true}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-embedding}
  RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3-int8}
  CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-6}
  CHAT_HISTORY_MESSAGE_CHARS: ${CHAT_HISTORY_MESSAGE_CHARS:-600}
  CHAT_QUERY_REWRITE: ${CHAT_QUERY_REWRITE:-true}
  CHAT_REWRITE_MAX_OUTPUT_TOKENS: ${CHAT_REWRITE_MAX_OUTPUT_TOKENS:-200}
  STT_PROVIDER: ${STT_PROVIDER:-elevenlabs}
  STT_FALLBACK_PROVIDER: ${STT_FALLBACK_PROVIDER:-openai}
  STT_MODEL: ${STT_MODEL:-gpt-transcribe}
  TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
  TTS_FALLBACK_PROVIDER: ${TTS_FALLBACK_PROVIDER:-openai_realtime}
  TTS_MODEL: ${TTS_MODEL:-gpt-realtime-2.1-mini}
  TTS_VOICE: ${TTS_VOICE:-marin}
  TTS_SPEED: ${TTS_SPEED:-1.0}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
  ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v2}
  ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_v4_turbo}
  ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
  ROBOT_API_KEY: ${ROBOT_API_KEY:-}
  KNOWLEDGE_DIR: /app/knowledge
  ROBOT_APPROVAL_MANIFEST: /app/robot-approval.json
  ROBOT_REQUESTS_PER_MINUTE: ${ROBOT_REQUESTS_PER_MINUTE:-20}
  ROBOT_INDEX_PATH: /app/.cache/fastembed/robot-semantic-index.json
  ROBOT_MIN_SIMILARITY: ${ROBOT_MIN_SIMILARITY:-0.4}
  ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
  MAX_AUDIO_UPLOAD_SIZE_BYTES: ${MAX_AUDIO_UPLOAD_SIZE_BYTES:-26214400}
  MAX_VIDEO_UPLOAD_SIZE_BYTES: ${MAX_VIDEO_UPLOAD_SIZE_BYTES:-524288000}
  MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-1800}
  VIDEO_MATCH_MIN_SCORE: ${VIDEO_MATCH_MIN_SCORE:-0.55}
  VIDEO_MAX_SUGGESTIONS: ${VIDEO_MAX_SUGGESTIONS:-1}
  VIDEO_URL_TTL_MINUTES: ${VIDEO_URL_TTL_MINUTES:-60}
  MINIO_VIDEOS_BUCKET: ${MINIO_VIDEOS_BUCKET:-semyzbay-videos}
  CELERY_BROKER_URL: redis://semyzbay-redis:6379/1
  CELERY_RESULT_BACKEND: redis://semyzbay-redis:6379/2

services:
  semyzbay-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      <<: *app-environment
      SEED_ORGANIZATION_NAME: ${SEED_ORGANIZATION_NAME:-Semyzbay Demo}
      SEED_ORGANIZATION_DESCRIPTION: ${SEED_ORGANIZATION_DESCRIPTION:-Local development organization}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-superadmin@semyzbay.kz}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-}
      SEED_ORG_ADMIN_EMAIL: ${SEED_ORG_ADMIN_EMAIL:-orgadmin@semyzbay.kz}
      SEED_ORG_ADMIN_PASSWORD: ${SEED_ORG_ADMIN_PASSWORD:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-user@semyzbay.kz}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      SEED_SAFETY_EMPLOYEE_PASSWORD: ${SEED_SAFETY_EMPLOYEE_PASSWORD:-}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - fastembed_cache:/app/.cache/fastembed
      - ./knowledge:/app/knowledge:ro
      - ./robot-approval.json:/app/robot-approval.json:ro
    depends_on:
      semyzbay-postgres:
        condition: service_healthy
      semyzbay-redis:
        condition: service_healthy
      semyzbay-qdrant:
        condition: service_healthy
      semyzbay-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [semyzbay]

  semyzbay-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-1}",
      ]
    environment: *app-environment
    volumes:
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      semyzbay-postgres:
        condition: service_healthy
      semyzbay-redis:
        condition: service_healthy
      semyzbay-qdrant:
        condition: service_healthy
      semyzbay-minio:
        condition: service_healthy
    restart: unless-stopped
    networks: [semyzbay]

  semyzbay-postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-semyzbay_db}
      POSTGRES_USER: ${POSTGRES_USER:-semyzbay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [semyzbay]

  semyzbay-redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [semyzbay]

  semyzbay-qdrant:
    # Matches qdrant-client 1.20.x. Qdrant 1.20 cannot open 1.15 storage (payload index
    # format changed), so it uses a fresh volume; the old `qdrant_data` volume is kept for
    # rollback. After the first start run `make reindex` (scripts/reindex_documents.py) to
    # rebuild vectors from PostgreSQL and MinIO.
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant_data_v1_20:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [semyzbay]

  semyzbay-minio:
    build:
      context: .
      dockerfile: docker/Dockerfile.minio
      args:
        MINIO_VERSION: RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-change_me}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [semyzbay]

networks:
  semyzbay:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  qdrant_data_v1_20:
  minio_data:
  fastembed_cache:
